name: Build KrutoSborka APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          set -e
          ZIP="$(find . -maxdepth 2 -type f -name '*.zip' -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "::error::ZIP archive not found in repository"
            exit 1
          fi

          echo "Extracting $ZIP"
          mkdir -p extracted
          unzip -oq "$ZIP" -d extracted

          SETTINGS="$(find extracted -type f \( \
            -name settings.gradle -o \
            -name settings.gradle.kts \
          \) -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle not found inside ZIP"
            find extracted -maxdepth 4 -type f | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "::error::app folder not found beside settings.gradle"
            find extracted -maxdepth 5 -type d | head -200
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KrutoSborka-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

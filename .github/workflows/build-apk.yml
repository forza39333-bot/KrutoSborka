name: Build KrutoSborka APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find Gradle project
        id: project
        shell: bash
        run: |
          echo "Searching for settings.gradle..."
          find . -type f \( \
            -name settings.gradle \
            -o -name settings.gradle.kts \
          \) -not -path '*/.gradle/*' -print

          PROJECT_FILE="$(find . -type f \( \
            -name settings.gradle \
            -o -name settings.gradle.kts \
          \) -not -path '*/.gradle/*' -print -quit)"

          if [ -z "$PROJECT_FILE" ]; then
            echo "::error::Gradle project not found. Upload settings.gradle and build.gradle to the repository."
            echo "Repository files:"
            find . -maxdepth 4 -type f | sort | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Gradle project directory: $PROJECT_DIR"

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon assembleDebug

      - name: Find APK
        id: apk
        shell: bash
        run: |
          APK_PATH="$(find '${{ steps.project.outputs.dir }}' \
            -type f -path '*/build/outputs/apk/*/*.apk' \
            -name '*debug*.apk' -print -quit)"

          if [ -z "$APK_PATH" ]; then
            echo "::error::APK not found after build."
            find '${{ steps.project.outputs.dir }}' -type f -name '*.apk' -print
            exit 1
          fi

          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KrutoSborka-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
